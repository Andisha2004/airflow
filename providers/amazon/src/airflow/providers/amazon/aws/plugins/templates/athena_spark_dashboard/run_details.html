<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Athena Spark Run Details</title>
</head>
<body>
    <h2>Athena Spark Run Details</h2>
    <p><a href="./">Back to dashboard</a></p>

    {% if error %}
    <p>{{ error }}</p>
    {% else %}
    <table border="1" cellpadding="6" cellspacing="0" style="border-collapse: collapse;">
        {% for key, value in detail_rows %}
        <tr>
            <th align="left">{{ key }}</th>
            <td>{{ value }}</td>
        </tr>
        {% endfor %}
    </table>

    {% if task_run_url %}
    <p><a href="{{ task_run_url }}">Open task run</a></p>
    {% endif %}

    <h4>Raw Metadata</h4>
    <pre>{{ metadata_json }}</pre>
    {% endif %}
</body>
</html>
